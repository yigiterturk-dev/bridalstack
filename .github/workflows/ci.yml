name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Derleme ve tip üretimi için yer tutucu; CI gerçek bir veritabanına bağlanmaz.
      # Uçtan uca testler (tests/e2e) canlı veritabanı istediği için burada çalışmaz.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
