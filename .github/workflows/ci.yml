name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Derleme ve tip üretimi için yer tutucu; CI gerçek bir veritabanına bağlanmaz.
      # Uçtan uca testler (tests/e2e) canlı veritabanı istediği için burada çalışmaz.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Keep dependency installation from executing package lifecycle hooks.
      # Prisma generation is invoked explicitly in the next step and in build.
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runtime dependencies must have no high/critical advisories. The full
      # tree still gets a critical-only gate because lint tooling currently
      # carries non-runtime high advisories with no compatible fix.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
